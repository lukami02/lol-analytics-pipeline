services:

  api:
    build:
      context: .
      target: prod
    image: lol-analytics
    command: uvicorn lol_analytics.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data

  dashboard:
    build: .
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    environment:
      API_URL: http://api:8000

  etl:
    image: lol-analytics
    command: sleep infinity
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.etl.schedule: "0 30 12 * * *"
      ofelia.job-exec.etl.command: "sh -c 'python src/lol_analytics/pipeline.py extract && python src/lol_analytics/pipeline.py load && python src/lol_analytics/pipeline.py transform'"

  scheduler:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    restart: unless-stopped
    environment:
      TZ: Europe/Belgrade
    depends_on:
      - etl
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  tests:
    build:
      context: .
      target: test
    profiles: ["test"]