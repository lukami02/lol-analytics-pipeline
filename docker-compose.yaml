services:

  api:
    build:
      context: .
      target: prod
    image: lol-analytics
    command: uvicorn lol_analytics.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data

  dashboard:
    build: .
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    environment:
      API_URL: http://api:8000

  etl:
    build: .
    profiles: ["etl"]   
    command: >
      sh -c "python src/lol_analytics/pipeline.py extract &&
             python src/lol_analytics/pipeline.py load &&
             python src/lol_analytics/pipeline.py transform"
    env_file: .env
    volumes:
      - ./data:/app/data

  tests:
    build:
      context: .
      target: test
    profiles: ["test"]